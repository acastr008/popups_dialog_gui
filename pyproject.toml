# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popups-dialog-gui"         # Nombre único para el proyecto PyPI (único)
version = "0.1.0"
description = "Help module for overlays and contextual help in Pygame"
readme = "README.md"  # Cambiado en esta version
requires-python = ">=3.9"
authors = [
  { name = "Antonio Castro Snurmacher", email = "acastro0841@gmail.com" },
]
# license = { file = "LICENSE.md" }  # Enlaza directamente al archivo de licencia
license = "MIT"
dependencies = [
  "pygame>=2.0",
  "help-core-pygame>=0.1.2",
]

keywords = ["pygame", "help", "overlay", "games", "ayuda"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Games/Entertainment",
]

[project.urls]  # Enlaces para mis usuarios
Homepage = "https://github.com/acastr008/popups_dialog_gui"
Source = "https://github.com/acastr008/popups_dialog_gui"
Issues = "https://github.com/acastr008/popups_dialog_gui/issues" # Pagina donde GitHub gestiona el seguimiento de errores y mejoras.


[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
popups_dialog_gui = [
  "assets/**/*.png",
  "assets/**/*.jpg",
  "assets/**/*.jpeg",

  "assets/**/*.ttf",

  "assets/**/*.txt",
  "assets/**/*.md",
  "assets/**/*.rst",

  "assets/**/*.json",
  "assets/**/*.ini",
  "assets/**/*.cfg",

  "assets/**/*.mp3",
  "assets/**/*.wav",
  "assets/**/*.ogg",
]
